name: Weekly yt-dlp Smoke Test

on:
  schedule:
    # Every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke test non-blockingly
        id: smoke
        continue-on-error: true
        run: |
          python scripts/smoke_test.py

      - name: Report results
        if: always()
        run: |
          echo "Smoke test completed with outcome: ${{ steps.smoke.outcome }}"
