<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="preload" href="{{ url_for('static', filename='fonts/space-grotesk.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
  <style>
    body { background-color: #050505; color: #ffffff; font-family: 'Space Grotesk', sans-serif; }
    .glass-panel { background: rgba(25, 25, 25, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.3s ease; }
    .glass-btn:hover { background: rgba(255, 255, 255, 0.15); }
    :focus-visible { outline: 2px solid rgba(255, 255, 255, 0.6); outline-offset: 2px; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-12 px-4 antialiased">
  <main class="w-full max-w-md glass-panel p-8 rounded-2xl shadow-2xl flex flex-col items-center text-center gap-4">
    <div class="w-12 h-12 rounded-full bg-red-500/10 flex items-center justify-center text-red-400 mb-2">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>
    <h1 class="text-3xl font-bold tracking-tight">500</h1>
    <h2 class="text-lg font-medium text-zinc-300">Server Error</h2>
    <p class="text-xs text-zinc-400 leading-relaxed">
      A temporary error occurred while processing your request. Please try again in a few moments.
    </p>
    <a href="/" class="glass-btn px-6 py-2.5 rounded-xl text-sm font-medium text-white mt-2">
      Return Home
    </a>
  </main>
</body>
</html>
